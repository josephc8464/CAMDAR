[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "camdar"
version = "0.1.0"
requires-python = ">=3.10,<3.13"
dependencies = [
  "pyyaml~=6.0",
  "numpy~=1.26",
  # x86/macOS dev installs OpenCV from pip (includes FFmpeg backend support).
  # Jetson/aarch64 should use the platform OpenCV build (typically with GStreamer).
  "opencv-python~=4.10; platform_machine != 'aarch64'",
  "ultralytics~=8.3",
  "flask~=3.0"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
