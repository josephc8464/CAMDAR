app:
  camera_id: "cam_02"
  display: false
  log_events: true
  # Realtime preset applied at config load: balanced|aggressive|quality|off
  realtime_profile: "off"
  # Select active source key below: "webcam" or "pi_cam"
  source_select: "zedx_left"
  preview_fps: 30
  sources:
    webcam: "0"
    pi_cam: "udp://192.168.50.1:5556?overrun_nonfatal=1&fifo_size=50000000"
    zedx_mono: "zedxonesrc camera-resolution=2 camera-fps=30 ! videoconvert ! video/x-raw, format=BGR ! appsink drop=true sync=false"
    zedx_stereo: "zedsrc stream-type=2 ! videoconvert ! video/x-raw, format=BGR ! appsink drop=true sync=false"
    zedx_left: "zedsrc stream-type=0 camera-fps=30 ! videoconvert ! video/x-raw,format=BGR,framerate=30/1 ! appsink drop=true max-buffers=1 sync=false"

pipeline:
  stages:
    - name: "pose"
      type: "pose.yolo"
      enabled: true
      params:
        repo_root: "." # TODO: Come back to this
        model_path: "assets/models/yolo26x-pose.pt"
        conf: 0.25
        iou: 0.7
        max_det: 1
        kpt_conf_thresh: 0.2
        inference_stride: 7
        track_with_bytetrack: true
        tracker_cfg: "bytetrack.yaml"
        persist_tracks: true

    - name: "track"
      type: "tracking.bytetrack"
      enabled: false
      params:
        model_path: "assets/models/yolo26x-pose.pt"
        conf_thresh: 0.25

    - name: "sequence"
      type: "sequence.builder"
      enabled: true
      params:
        window: 16
        max_gap: 3
        use_norm: true

    - name: "posture"
      type: "posture.heuristic"
      enabled: true
      params:
        conf_thresh: 0.3
        lying_ratio: 2.5
        sitting_y_span: 1.2
        debug: true

    - name: "status"
      type: "status.rules"
      enabled: true
      params:
        emergency_seconds: 2.0
        fps_assumed: 30.0
        min_pose_conf: 0.3
        min_posture_prob: 0.5

    - name: "overlay"
      type: "viz.overlay"
      enabled: true
      params:
        draw_kpts: true
        kpt_thresh: 0.3
